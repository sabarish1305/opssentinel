[project]
name = "opssentinel"
version = "0.1.0"
description = "An evidence-first incident response agent powered by TrueForge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
]
[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
